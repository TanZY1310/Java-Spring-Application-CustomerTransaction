<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Search</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Customer Search</h1>
<div class="form-container">
    <div class="form-group">
    <button onclick="displayAllCustomer()">Display All Customers</button>
    </div>
</div>

<div class="form-container">
    <!-- Search by ID Form -->
    <div class="form-group">
        <label for="searchId">Search by Customer ID:</label>
        <input type="number" id="searchId" placeholder="Enter Customer ID" />
        <button onclick="searchById()">Search</button>
    </div>

    <!-- Search by Description Form -->
    <div class="form-group">
        <label for="searchDescription">Search by Description:</label>
        <input type="text" id="searchDescription" placeholder="Enter Description" />
        <button onclick="searchByDescription()">Search</button>
    </div>
</div>

<!-- Results Section -->
<div class="results" id="results">
    <!-- Results will be displayed here -->
</div>

<!-- Pagination Controls -->
<div class="pagination" id="pagination">
    <button id="prevButton" onclick="prevPage()">Previous</button>
    <span id="currentPage">Page 1</span>
    <button id="nextButton" onclick="nextPage()">Next</button>
</div>

<!-- Link to the external JavaScript file -->
<script src="script.js"></script>
</body>
</html>
